reloader:
  reloadStrategy: annotations
  readOnlyRootFileSystem: true
  deployment:
    resources:
      requests:
        cpu: "10m"
        memory: "128Mi"
      limits:
        memory: "512Mi"
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
